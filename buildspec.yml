version: 0.2

phases:
  pre_build:
    commands:
      - echo "Checking AWS configuration"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "AWS account identity retrieved"
      - export IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/varynx-backend"
      - export IMAGE_TAG="latest"
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  build:
    commands:
      - echo "Building Varynx backend Docker image"
      - docker build -t "${IMAGE_URI}:${IMAGE_TAG}" .

  post_build:
    commands:
      - echo "Pushing Varynx image to ECR"
      - docker push "${IMAGE_URI}:${IMAGE_TAG}"
      - echo "Varynx image pushed successfully"
