
version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail

        echo "======================================"
        echo "VARYNX - PREPARING CONTAINER BUILDS"
        echo "======================================"

        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        AWS_REGION="${AWS_DEFAULT_REGION}"
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

        IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
        IMAGE_TAG="${IMAGE_TAG:0:12}"

        echo "AWS Account: ${ACCOUNT_ID}"
        echo "AWS Region: ${AWS_REGION}"
        echo "Image Tag: ${IMAGE_TAG}"

        echo "Logging in to Amazon ECR..."

        aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS --password-stdin "$REGISTRY"

        echo "ECR login successful."

        echo "Checking ECR repositories..."

        aws ecr describe-repositories \
          --repository-names varynx-backend varynx-streamlit \
          --region "$AWS_REGION"

  build:
    commands:
      - |
        set -euo pipefail

        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

        IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
        IMAGE_TAG="${IMAGE_TAG:0:12}"

        echo "======================================"
        echo "BUILDING VARYNX BACKEND"
        echo "======================================"

        test -f Dockerfile

        docker build \
          --file Dockerfile \
          --tag "$REGISTRY/varynx-backend:$IMAGE_TAG" \
          .

        echo "Backend image built successfully."

        echo "======================================"
        echo "BUILDING VARYNX STREAMLIT FRONTEND"
        echo "======================================"

        test -f dashboard_streamlit/Dockerfile

        docker build \
          --file dashboard_streamlit/Dockerfile \
          --tag "$REGISTRY/varynx-streamlit:$IMAGE_TAG" \
          .

        echo "Streamlit image built successfully."

        echo "======================================"
        echo "VERIFYING BUILT IMAGES"
        echo "======================================"

        docker image inspect "$REGISTRY/varynx-backend:$IMAGE_TAG"
        docker image inspect "$REGISTRY/varynx-streamlit:$IMAGE_TAG"

        echo "Both Docker images verified successfully."

  post_build:
    commands:
      - |
        set -euo pipefail

        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

        IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
        IMAGE_TAG="${IMAGE_TAG:0:12}"

        echo "======================================"
        echo "PUSHING VARYNX BACKEND TO ECR"
        echo "======================================"

        docker push "$REGISTRY/varynx-backend:$IMAGE_TAG"

        docker tag \
          "$REGISTRY/varynx-backend:$IMAGE_TAG" \
          "$REGISTRY/varynx-backend:latest"

        docker push "$REGISTRY/varynx-backend:latest"

        echo "Backend image pushed successfully."

        echo "======================================"
        echo "PUSHING STREAMLIT FRONTEND TO ECR"
        echo "======================================"

        docker push "$REGISTRY/varynx-streamlit:$IMAGE_TAG"

        docker tag \
          "$REGISTRY/varynx-streamlit:$IMAGE_TAG" \
          "$REGISTRY/varynx-streamlit:latest"

        docker push "$REGISTRY/varynx-streamlit:latest"

        echo "Streamlit image pushed successfully."

        echo "======================================"
        echo "VARYNX CONTAINER BUILD COMPLETED"
        echo "======================================"

        echo "Backend: ${REGISTRY}/varynx-backend:${IMAGE_TAG}"
        echo "Frontend: ${REGISTRY}/varynx-streamlit:${IMAGE_TAG}"

        echo "Both images successfully pushed to Amazon ECR."
