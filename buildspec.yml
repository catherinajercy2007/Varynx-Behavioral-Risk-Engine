
version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - echo "Preparing Varynx deployment..."
      - test -n "$AWS_DEFAULT_REGION" || (echo "AWS_DEFAULT_REGION missing" && exit 1)
      - export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - export IMAGE_TAG="${IMAGE_TAG:0:12}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - echo "Building FastAPI backend..."
      - docker build -f Dockerfile.backend -t "$REGISTRY/varynx-backend:$IMAGE_TAG" .
      - echo "Building Streamlit frontend..."
      - docker build -f Dockerfile.frontend -t "$REGISTRY/varynx-streamlit:$IMAGE_TAG" .

  post_build:
    commands:
      - echo "Pushing backend..."
      - docker push "$REGISTRY/varynx-backend:$IMAGE_TAG"
      - echo "Pushing frontend..."
      - docker push "$REGISTRY/varynx-streamlit:$IMAGE_TAG"
      - echo "Both images pushed successfully."
