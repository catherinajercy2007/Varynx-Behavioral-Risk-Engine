
version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail

        echo "======================================"
        echo "VARYNX CONTAINER BUILD - PREPARATION"
        echo "======================================"

        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        AWS_REGION="${AWS_DEFAULT_REGION:-ap-southeast-2}"
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

        IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
        IMAGE_TAG="${IMAGE_TAG:0:12}"

        BACKEND_REPOSITORY="varynx-backend"
        FRONTEND_REPOSITORY="varynx-streamlit"

        BACKEND_IMAGE="${REGISTRY}/${BACKEND_REPOSITORY}"
        FRONTEND_IMAGE="${REGISTRY}/${FRONTEND_REPOSITORY}"

        echo "AWS Account: ${ACCOUNT_ID}"
        echo "AWS Region: ${AWS_REGION}"
        echo "Image Tag: ${IMAGE_TAG}"

        echo "Logging in to Amazon ECR..."

        aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS --password-stdin "$REGISTRY"

        echo "ECR login successful."

  build:
    commands:
      - |
        set -euo pipefail

        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        AWS_REGION="${AWS_DEFAULT_REGION:-ap-southeast-2}"
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

        IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
        IMAGE_TAG="${IMAGE_TAG:0:12}"

        BACKEND_IMAGE="${REGISTRY}/varynx-backend"
        FRONTEND_IMAGE="${REGISTRY}/varynx-streamlit"

        echo "======================================"
        echo "BUILDING VARYNX BACKEND"
        echo "======================================"

        if [ ! -f Dockerfile ]; then
          echo "ERROR: Root Dockerfile not found."
          exit 1
        fi

        docker build \
          --file Dockerfile \
          --tag "${BACKEND_IMAGE}:${IMAGE_TAG}" \
          .

        echo "Backend image built."

        echo "======================================"
        echo "BUILDING VARYNX STREAMLIT FRONTEND"
        echo "======================================"

        if [ ! -f dashboard_streamlit/Dockerfile ]; then
          echo "ERROR: dashboard_streamlit/Dockerfile not found."
          exit 1
        fi

        if [ ! -f dashboard_streamlit/app.py ]; then
          echo "ERROR: dashboard_streamlit/app.py not found."
          exit 1
        fi

        docker build \
          --file dashboard_streamlit/Dockerfile \
          --tag "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
          .

        echo "Streamlit image built."

        echo "======================================"
        echo "VERIFYING DOCKER IMAGES"
        echo "======================================"

        docker image inspect "${BACKEND_IMAGE}:${IMAGE_TAG}" > /dev/null
        docker image inspect "${FRONTEND_IMAGE}:${IMAGE_TAG}" > /dev/null

        echo "Both Docker images verified successfully."

  post_build:
    commands:
      - |
        set -euo pipefail

        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        AWS_REGION="${AWS_DEFAULT_REGION:-ap-southeast-2}"
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

        IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
        IMAGE_TAG="${IMAGE_TAG:0:12}"

        BACKEND_IMAGE="${REGISTRY}/varynx-backend"
        FRONTEND_IMAGE="${REGISTRY}/varynx-streamlit"

        echo "======================================"
        echo "PUSHING BACKEND IMAGE"
        echo "======================================"

        docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"

        docker tag \
          "${BACKEND_IMAGE}:${IMAGE_TAG}" \
          "${BACKEND_IMAGE}:latest"

        docker push "${BACKEND_IMAGE}:latest"

        echo "Backend image pushed successfully."

        echo "======================================"
        echo "PUSHING STREAMLIT IMAGE"
        echo "======================================"

        docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"

        docker tag \
          "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
          "${FRONTEND_IMAGE}:latest"

        docker push "${FRONTEND_IMAGE}:latest"

        echo "Streamlit image pushed successfully."

        echo "======================================"
        echo "VARYNX BUILD COMPLETED SUCCESSFULLY"
        echo "======================================"

        echo "Backend: ${BACKEND_IMAGE}:${IMAGE_TAG}"
        echo "Frontend: ${FRONTEND_IMAGE}:${IMAGE_TAG}"
